<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#61ccf5"><title>Kanji Pop! — Trượt & ghép</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900;1000&family=Noto+Sans+JP:wght@600;700&display=swap">
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="slide.css">
</head><body><div id="kp-preview"><main id="kanji-pop" aria-label="Kanji Pop — Trượt và ghép">
<div class="kp-cloud c1"></div><div class="kp-cloud c2"></div><div class="kp-cloud c3"></div>
<header class="kp-header">
<button class="kp-round" id="kp-pause" aria-label="Tạm dừng và hướng dẫn"><i data-lucide="pause" aria-hidden="true">Ⅱ</i></button>
<div class="kp-logo" aria-label="Kanji Pop">KANJI <span>POP!</span><b>✦</b></div>
<button class="kp-round" id="kp-sound" aria-label="Bật âm thanh" aria-pressed="false"><i data-lucide="volume-x" aria-hidden="true">♪</i></button>
</header>
<div class="kp-level"><span class="kp-ribbon">MÀN <b id="kp-level-no">01</b></span><span class="kp-pill"><span class="kp-coin">★</span><b id="kp-points">0</b></span></div>
<div class="goal-heading"><span>THU THẬP ĐỦ 3 LOẠI CHỮ</span><span id="kp-progress">0 / 6</span></div>
<section class="goal-list" id="goals" aria-label="Công thức và mục tiêu"></section>
<section class="kp-board slide-panel" aria-label="Bàn trượt 4 nhân 4">
<div class="kp-board-tab">TRƯỢT · GHÉP · THU THẬP</div>
<div class="slide-board" id="slide-board" role="group" aria-label="Vuốt bốn hướng để trượt toàn bộ khối. Có thể dùng các nút mũi tên bên dưới."><div class="board-cells" aria-hidden="true"></div><div class="board-tiles" id="tiles"></div><div class="board-effects" id="effects" aria-hidden="true"></div></div>
<div class="board-info"><span>Lượt <b id="moves">0</b></span><span class="next-block">TIẾP THEO <b id="next-piece" lang="ja">木</b></span><span><b id="free-spaces">7</b> ô trống</span></div>
</section>
<p class="slide-feedback" id="feedback" aria-live="polite">Vuốt để đưa các mảnh lại gần nhau.</p>
<nav class="direction-pad" aria-label="Điều khiển hướng trượt">
<button class="kp-round direction" data-dir="left" aria-label="Trượt trái"><i data-lucide="arrow-left">←</i></button>
<button class="kp-round direction" data-dir="up" aria-label="Trượt lên"><i data-lucide="arrow-up">↑</i></button>
<button class="kp-round direction" data-dir="down" aria-label="Trượt xuống"><i data-lucide="arrow-down">↓</i></button>
<button class="kp-round direction" data-dir="right" aria-label="Trượt phải"><i data-lucide="arrow-right">→</i></button>
</nav>
<div class="kp-tools">
<button class="kp-tool" id="undo"><span class="kp-tool-icon purple"><i data-lucide="undo-2">↶</i></span><span>Hoàn tác <b id="undo-count">3</b></span></button>
<button class="rule-button" id="help"><i data-lucide="circle-help">?</i><span>Cách chơi</span></button>
<button class="kp-tool" id="restart"><span class="kp-tool-icon"><i data-lucide="rotate-ccw">↻</i></span><span>Chơi lại</span></button>
</div>
<div class="kp-modal-layer" id="modal" hidden></div><div class="kp-confetti" id="kp-confetti" aria-hidden="true"></div>
</main></div><script src="lucide.min.js"></script><script src="slide-engine.js"></script><script src="slide.js"></script></body></html>

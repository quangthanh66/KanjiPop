
<!DOCTYPE html>

  <title>Phương Án 1 Nâng Cấp: Đảo Ngọc & Thánh Địa Hán Tự 3D</title>
  <link rel="stylesheet" href="journey-map.css">
  <style>
    body { margin: 0; padding: 0; overflow: hidden; font-family: "Nunito", sans-serif; background: #0284c7; }
    #kanji-pop { width: 100vw; height: 100vh; height: 100dvh; position: relative; overflow: hidden; }

    /* Custom Positioning & Sizing for Hero 3D Assets */
    .anime-hero-prop {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      object-fit: contain;
      user-select: none;
      transition: transform 0.25s ease;
    }

    /* 1. Grand Pagoda Shrine (Upper Left Sky) */
    .pagoda-prop {
      left: 6%;
      top: 10%;
      width: clamp(230px, 20vw, 320px);
      filter: drop-shadow(0 16px 28px rgba(18, 89, 133, 0.28));
      animation: heroFloatSlow 7.5s ease-in-out infinite;
    }

    /* 2. Ancient Glowing Kanji Monolith Stele "道" (Lower Left Hill) */
    .monolith-prop {
      left: 12%;
      top: 56%;
      width: clamp(150px, 13vw, 210px);
      filter: drop-shadow(0 16px 24px rgba(6, 78, 59, 0.35));
      animation: heroFloatSlow 6.8s ease-in-out infinite -2s;
    }

    /* 3. Grand Sakura Island (Lower Right) */
    .sakura-island-prop {
      right: 2%;
      bottom: 5%;
      width: clamp(240px, 21vw, 330px);
      filter: drop-shadow(0 18px 28px rgba(6, 78, 59, 0.3));
      animation: heroFloatSlow 7.2s ease-in-out infinite -1s;
    }

    /* 4. Crystal Island (Mid-Right Sky) */
    .crystal-island-prop {
      right: 5%;
      top: 34%;
      width: clamp(170px, 15vw, 230px);
      filter: drop-shadow(0 14px 22px rgba(18, 89, 133, 0.25));
      animation: heroFloatSlow 6.4s ease-in-out infinite -3s;
    }

    /* 5. Calligraphy Set (Mid-Left Trail) */
    .brush-prop {
      left: 27%;
      top: 46%;
      width: clamp(95px, 8.5vw, 130px);
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
      animation: heroFloatSlow 5.8s ease-in-out infinite -1.5s;
    }

    /* 6. Treasure Chest (Near Summit) */
    .chest-prop {
      right: 28%;
      top: 13%;
      width: clamp(95px, 8.5vw, 125px);
      filter: drop-shadow(0 10px 18px rgba(18, 89, 133, 0.28));
      animation: heroFloatSlow 5.5s ease-in-out infinite -0.5s;
    }

    /* 7. Star Crystal */
    .star-crystal-prop {
      right: 12%;
      top: 10%;
      width: clamp(68px, 6vw, 90px);
      filter: drop-shadow(0 8px 14px rgba(254, 240, 138, 0.45));
      animation: heroFloatSlow 5.0s ease-in-out infinite -2.5s;
    }

    @keyframes heroFloatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* Adjusted Floating Gems Positions so they don't clash with the Hero Assets */
    #kanji-pop .anime-float-gem.g1 { left: 24%; top: 18%; }
    #kanji-pop .anime-float-gem.g2 { left: 4%; top: 58%; }
    #kanji-pop .anime-float-gem.g3 { left: 16%; top: 40%; }
    #kanji-pop .anime-float-gem.g4 { right: 24%; top: 52%; }
    #kanji-pop .anime-float-gem.g5 { right: 19%; top: 30%; }
    #kanji-pop .anime-float-gem.g6 { right: 16%; top: 64%; }

    /* Floating Kanji */
    #kanji-pop .anime-float-kanji.k1 { left: 28%; top: 26%; }
    #kanji-pop .anime-float-kanji.k2 { left: 6%; top: 44%; }
    #kanji-pop .anime-float-kanji.k3 { left: 28%; top: 68%; }
    #kanji-pop .anime-float-kanji.k4 { left: 14%; top: 78%; }
    #kanji-pop .anime-float-kanji.k5 { right: 21%; top: 22%; }
    #kanji-pop .anime-float-kanji.k6 { right: 14%; top: 48%; }
    #kanji-pop .anime-float-kanji.k7 { right: 26%; top: 66%; }
    #kanji-pop .anime-float-kanji.k8 { right: 12%; top: 76%; }

    /* Responsive for Mobile (max-width: 859px) */
    @media (max-width: 859px) {
      .pagoda-prop {
        left: 24%;
        top: 10%;
        width: 100px;
        opacity: 0.95;
      }
      .monolith-prop {
        left: 25%;
        top: 61%;
        width: 78px;
        opacity: 1;
      }
      .sakura-island-prop {
        right: 22%;
        bottom: 7%;
        width: 115px;
        opacity: 0.95;
      }
      .crystal-island-prop {
        right: 24%;
        top: 36%;
        width: 85px;
        opacity: 0.95;
      }
      .brush-prop {
        left: 27%;
        top: 49%;
        width: 62px;
      }
      .chest-prop {
        right: 26%;
        top: 14%;
        width: 62px;
      }
      .star-crystal-prop {
        right: 22%;
        top: 8%;
        width: 42px;
      }
    }

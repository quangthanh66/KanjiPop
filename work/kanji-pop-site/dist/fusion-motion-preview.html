<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanji Pop — thử chuyển động ghép</title>
<link rel="stylesheet" href="fusion-fx.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#080f22;color:#e8efff;font:16px system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}main{width:min(100%,720px)}h1{font-size:24px;margin:0 0 10px}p{color:#a8b7d5;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}button,a{font:inherit}button{color:#e6ecff;background:#172844;border:1px solid #395278;border-radius:12px;padding:12px 16px;cursor:pointer}button[aria-pressed=true]{border-color:#b8cbff;background:#2b4166}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}#stage{height:360px;position:relative;border-radius:24px;background:radial-gradient(ellipse at 50% 60%,#202750,transparent 70%),#0b152c;overflow:hidden;border:1px solid #273754}#stage:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#b6c9ff66 1px,transparent 1px);background-size:49px 53px;opacity:.4}.sample{position:absolute;top:40%;width:90px;height:90px}.sample:first-child{left:calc(50% - 125px)}.sample:nth-child(2){left:calc(50% + 35px)}.sample .jewel-art{width:100%;height:100%}.sample .result-glyph{position:absolute;inset:0;display:grid;place-items:center;color:white;font:700 34px 'Noto Sans JP',sans-serif;text-shadow:0 1px 3px #152034}.sample[data-pair="1"] .result-glyph{padding-top:22px}.result-gem{--gem-glyph-size:34px;--gem-label-y:50%}#status{text-align:center;min-height:26px;margin:14px 0;color:#c7d6f3}footer{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#a8c8ff}small{display:block;color:#8b9bb7;margin-top:20px;line-height:1.5}@media(max-width:440px){body{padding:16px}h1{font-size:21px}#stage{height:320px}button{padding:11px 13px}}
</style>
<main><h1>Ba nhịp ghép nguyên tố</h1><p>Chọn một nguyên tố để xem hai viên hút lại, nén sáng và tạo chữ mới.</p><nav aria-label="Nguyên tố"><button data-pair="0" aria-pressed="true">Sét</button><button data-pair="6" aria-pressed="false">Nước</button><button data-pair="1" aria-pressed="false">Ma thuật</button></nav><div id="stage" aria-label="Vùng xem hiệu ứng"></div><p id="status" role="status">Sẵn sàng</p><footer><button id="replay">Phát lại</button><a href="/">Về bàn chơi</a></footer><small>Mẫu chuyển động dùng trực tiếp hiệu ứng trong game. Tuân theo cài đặt giảm chuyển động của thiết bị.</small></main>
<script src="gem-art.js"></script><script src="fusion-fx.js"></script><script>
(()=>{
 const stage=document.querySelector('#stage'),status=document.querySelector('#status'),palettes={0:['#f4b400','#fff0a0'],1:['#9855e8','#e6d4ff'],6:['#4f8feb','#c7deff']};let pair=0,fx,timer,observer;
 function gem(text,id){const node=document.createElement('span');node.className='sample result-gem';node.dataset.pair=pair;node.style.setProperty('--tile-mid',palettes[pair][0]);node.style.setProperty('--tile-top',palettes[pair][1]);node.style.setProperty('--gem-label-y',KanjiGemArt.cutFor(pair).labelY+'%');node.innerHTML=KanjiGemArt.render(pair,id)+'<span class="result-glyph">'+text+'</span>';return node;}
 function reset(){clearTimeout(timer);observer?.disconnect();fx?.cancel?.();stage.replaceChildren(gem('一','first'),gem('二','second'));}
 function play(){reset();const rect=stage.getBoundingClientRect(),ingredients=[...stage.children].map(node=>{const b=node.getBoundingClientRect();return {node:node.cloneNode(true),x:b.x+b.width/2,y:b.y+b.height/2,width:b.width,height:b.height};});
  fx=KanjiFusion.play({host:stage,center:{x:ingredients[0].x-rect.x,y:ingredients[0].y-rect.y},source:{x:ingredients[1].x-rect.x,y:ingredients[1].y-rect.y},pair,ingredients,tier:2,sequence:12,reduced:matchMedia('(prefers-reduced-motion:reduce)').matches});
  if(!fx.duration){const result=gem('三','static-result');result.style.left='calc(50% - 45px)';stage.replaceChildren(result);status.textContent='Đã ghép thành 三 · Chế độ giảm chuyển động';return;}
  stage.replaceChildren();const result=gem('三','result');result.className='result-gem fusion-result';result.style.width='90px';result.style.height='90px';stage.append(result);fx.placeResult(result);
  const overlay=document.querySelector('.fusion-overlay'),names={pull:'Hút hai viên',compress:'Nén năng lượng',impact:'Ghép thành chữ',settle:'Dư âm'};status.textContent=names.pull;
  observer=new MutationObserver(()=>{status.textContent=names[overlay.dataset.phase]||names.pull;});observer.observe(overlay,{attributes:true,attributeFilter:['data-phase']});
  timer=setTimeout(()=>{observer.disconnect();status.textContent='Đã ghép thành 三';stage.replaceChildren(result);result.className='sample result-gem';result.style.cssText='left:calc(50% - 45px);top:40%;width:90px;height:90px;--tile-mid:'+palettes[pair][0]+';--gem-label-y:'+KanjiGemArt.cutFor(pair).labelY+'%';},fx.duration+30);
 }
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{pair=Number(b.dataset.pair);document.querySelectorAll('nav button').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));play();});document.querySelector('#replay').onclick=play;reset();
})();
</script></html>

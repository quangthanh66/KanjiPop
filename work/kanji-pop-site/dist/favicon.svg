<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldKanji" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#072b59" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- 3D Tile Base -->
  <rect x="12" y="16" width="104" height="104" rx="28" fill="#02476d"/>
  <rect x="12" y="10" width="104" height="104" rx="28" fill="url(#bgGrad)" filter="url(#tileShadow)"/>
  <!-- Glossy Rim -->
  <rect x="15" y="13" width="98" height="98" rx="25" fill="none" stroke="url(#highlight)" stroke-width="3"/>
  <!-- Inner Cross Lines (Sliding puzzle lines) -->
  <line x1="64" y1="20" x2="64" y2="104" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="20" y1="62" x2="108" y2="62" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Kanji Character 漢 -->
  <text x="64" y="80" font-family="'Noto Sans JP', 'Segoe UI', sans-serif" font-size="56" font-weight="900" text-anchor="middle" fill="#78350f" dy="4">漢</text>
  <text x="64" y="80" font-family="'Noto Sans JP', 'Segoe UI', sans-serif" font-size="56" font-weight="900" text-anchor="middle" fill="url(#goldKanji)" stroke="#fff" stroke-width="1.5">漢</text>
  <!-- Sparkle ✦ -->
  <path d="M 104 22 Q 104 32 114 32 Q 104 32 104 42 Q 104 32 94 32 Q 104 32 104 22 Z" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
</svg>